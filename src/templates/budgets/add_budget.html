{% extends "base.html" %}

{% block title %}Adicionar Orçamento{% endblock %}

{% block content %}
<div class="main-content">
    <h1>Adicionar Orçamento</h1>

    <form method="POST" action="{{ url_for('budgets.add_budget') }}">
        <div class="form-group">
            <label for="name">Nome</label>
            <input type="text" name="name" id="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="category_id">Categoria</label>
            <select name="category_id" id="category_id" class="form-control" required>
                {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="amount">Valor</label>
            <input type="number" name="amount" id="amount" class="form-control" step="0.01" min="0.01" required>
        </div>
        <div class="form-group">
            <label for="month">Mês</label>
            <input type="number" name="month" id="month" class="form-control" min="1" max="12" required>
        </div>
        <div class="form-group">
            <label for="year">Ano</label>
            <input type="number" name="year" id="year" class="form-control" min="2000" required>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Adicionar Orçamento</button>
        </div>
    </form>
</div>
{% endblock %}
