{% extends "base.html" %}

{% block title %}Editar Orçamento{% endblock %}

{% block content %}
<div class="main-content">
    <h1>Editar Orçamento</h1>

    <form method="POST" action="{{ url_for('budgets.edit_budget', budget_id=budget.id) }}">
        <div class="form-group">
            <label for="name">Nome</label>
            <input type="text" name="name" id="name" class="form-control" value="{{ budget.name }}" required>
        </div>
        <div class="form-group">
            <label for="category_id">Categoria</label>
            <select name="category_id" id="category_id" class="form-control" required>
                {% for category in categories %}
                    <option value="{{ category.id }}" {{ 'selected' if budget.category_id == category.id }}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="amount">Valor</label>
            <input type="number" name="amount" id="amount" class="form-control" step="0.01" min="0.01" value="{{ budget.amount }}" required>
        </div>
        <div class="form-group">
            <label for="month">Mês</label>
            <input type="number" name="month" id="month" class="form-control" min="1" max="12" value="{{ budget.month }}" required>
        </div>
        <div class="form-group">
            <label for="year">Ano</label>
            <input type="number" name="year" id="year" class="form-control" min="2000" value="{{ budget.year }}" required>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        </div>
    </form>
</div>
{% endblock %}
