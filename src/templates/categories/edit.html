{% extends "base.html" %}

{% block title %}Editar Categoria{% endblock %}

{% block content %}
<div class="container">
    <h1>Editar Categoria</h1>
    <form action="{{ url_for('categories.edit', id=category.id) }}" method="POST">
        <div class="form-group">
            <label for="name">Nome</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ category.name }}" required>
        </div>
        <div class="form-group">
            <label for="type">Tipo</label>
            <select class="form-control" id="type" name="type" required>
                <option value="entrada" {{ 'selected' if category.type == 'entrada' }}>Entrada</option>
                <option value="saída" {{ 'selected' if category.type == 'saída' }}>Saída</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
</div>
{% endblock %}
