{% extends "base.html" %}

{% block title %}Gerenciar Categorias{% endblock %}

{% block content %}
<div class="container">
    <h1>Gerenciar Categorias</h1>
    <a href="{{ url_for('categories.add') }}" class="btn btn-primary mb-3">Adicionar Categoria</a>
    <table class="table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
            <tr>
                <td>{{ category.name }}</td>
                <td>{{ category.type }}</td>
                <td>
                    <a href="{{ url_for('categories.edit', id=category.id) }}" class="btn btn-secondary">Editar</a>
                    <form action="{{ url_for('categories.delete', id=category.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger">Excluir</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
