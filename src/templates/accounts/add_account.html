<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Adicionar Nova Conta</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flashes">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('accounts.add_account') }}">
            <div class="form-group">
                <label for="name">Nome da Conta</label>
                <input type="text" name="name" id="name" required>
            </div>
            <div class="form-group">
                <label for="type">Tipo de Conta</label>
                <select name="type" id="type" required>
                    <option value="carteira">Carteira</option>
                    <option value="conta_corrente">Conta Corrente</option>
                    <option value="poupanca">Poupança</option>
                    <option value="cartao_credito">Cartão de Crédito</option>
                    <option value="investimento">Investimento</option>
                    <option value="outros">Outros</option>
                </select>
            </div>
            <div class="form-group">
                <label for="balance">Saldo Inicial</label>
                <input type="number" name="balance" id="balance" step="0.01" value="0.00" required>
            </div>
            <div class="form-group">
                <button type="submit">Adicionar Conta</button>
            </div>
        </form>
        <a href="{{ url_for('accounts.index') }}">Cancelar</a>
    </div>
</body>
</html>
