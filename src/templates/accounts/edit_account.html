<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Editar Conta</h1>

        <form method="POST" action="{{ url_for('accounts.edit_account', account_id=account.id) }}">
            <div class="form-group">
                <label for="name">Nome da Conta</label>
                <input type="text" name="name" id="name" value="{{ account.name }}" required>
            </div>
            <div class="form-group">
                <label for="type">Tipo de Conta</label>
                <input type="text" name="type" id="type" value="{{ account.type }}" disabled>
            </div>
            <div class="form-group">
                <label for="balance">Saldo</label>
                <input type="number" name="balance" id="balance" value="{{ account.balance }}" disabled>
            </div>
            <div class="form-group">
                <label for="active">Status</label>
                <input type="checkbox" name="active" id="active" value="true" {% if account.active %}checked{% endif %}>
                <label for="active">Ativa</label>
            </div>
            <div class="form-group">
                <button type="submit">Salvar Alterações</button>
            </div>
        </form>
        <a href="{{ url_for('accounts.index') }}">Cancelar</a>
    </div>
</body>
</html>
