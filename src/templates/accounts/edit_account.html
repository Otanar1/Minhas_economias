{% extends "base.html" %}

{% block title %}Editar Conta{% endblock %}

{% block content %}
<div class="main-content">
    <h1>Editar Conta</h1>

    <form method="POST" action="{{ url_for('accounts.edit_account', account_id=account.id) }}">
        <div class="form-group">
            <label for="name">Nome da Conta</label>
            <input type="text" name="name" id="name" class="form-control" value="{{ account.name }}" required>
        </div>
        <div class="form-group">
            <label for="type">Tipo de Conta</label>
            <select name="type" id="type" class="form-control" required>
                <option value="carteira" {{ 'selected' if account.type == 'carteira' }}>Carteira</option>
                <option value="conta_corrente" {{ 'selected' if account.type == 'conta_corrente' }}>Conta Corrente</option>
                <option value="poupanca" {{ 'selected' if account.type == 'poupanca' }}>Poupança</option>
                <option value="cartao_credito" {{ 'selected' if account.type == 'cartao_credito' }}>Cartão de Crédito</option>
            </select>
        </div>
        <div class="form-group">
            <label for="balance">Saldo</label>
            <input type="number" name="balance" id="balance" class="form-control" step="0.01" value="{{ account.balance }}" required>
        </div>
        <div class="form-group">
            <label for="active">Status</label>
            <select name="active" id="active" class="form-control" required>
                <option value="1" {{ 'selected' if account.active }}>Ativa</option>
                <option value="0" {{ 'selected' if not account.active }}>Inativa</option>
            </select>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        </div>
    </form>
</div>
{% endblock %}
