{% extends "base.html" %}

{% block title %}Adicionar Sonho{% endblock %}

{% block content %}
<div class="main-content">
    <h1>Adicionar Novo Sonho</h1>

    <form method="POST" action="{{ url_for('dreams.add_dream') }}">
        <div class="form-group">
            <label for="name">Nome</label>
            <input type="text" name="name" id="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="target_amount">Meta</label>
            <input type="number" name="target_amount" id="target_amount" class="form-control" step="0.01" min="0.01" required>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Adicionar Sonho</button>
        </div>
    </form>
</div>
{% endblock %}
