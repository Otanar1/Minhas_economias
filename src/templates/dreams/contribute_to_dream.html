{% extends "base.html" %}

{% block title %}Contribuir para o Sonho{% endblock %}

{% block content %}
<div class="main-content">
    <h1>Contribuir para o Sonho: {{ dream.name }}</h1>

    <form method="POST" action="{{ url_for('dreams.contribute_to_dream', dream_id=dream.id) }}">
        <div class="form-group">
            <label for="amount">Valor</label>
            <input type="number" name="amount" id="amount" class="form-control" step="0.01" min="0.01" required>
        </div>
        <div class="form-group">
            <label for="account_id">Conta de Origem</label>
            <select name="account_id" id="account_id" class="form-control" required>
                {% for account in accounts %}
                    <option value="{{ account.id }}">{{ account.name }} (Saldo: {{ account.balance | format_currency }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Contribuir</button>
        </div>
    </form>
</div>
{% endblock %}
