{% extends "base.html" %}

{% block title %}Esqueci minha senha | Minhas Economias{% endblock %}

{% block content %}
<div class="login-box">
    <h1 class="login-title">Esqueci minha senha</h1>

    <p class="recovery-description" style="margin-bottom: 20px; color: #666; line-height: 1.5;">
        Digite seu e-mail abaixo e enviaremos instruções para redefinir sua senha.
    </p>

    <form action="{{ url_for('auth.forgot_password') }}" method="post">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <button type="submit" class="btn-login">Enviar instruções</button>
    </form>

    <a href="{{ url_for('auth.login') }}" style="display: block; text-align: center; margin-top: 15px; color: #b5d56a; text-decoration: none;">Voltar para o login</a>
</div>
{% endblock %}
