{% extends "base.html" %}

{% block title %}Redefinir Senha | Minhas Economias{% endblock %}

{% block content %}
<div class="login-box">
    <h1 class="login-title">Redefinir Senha</h1>

    <form action="{{ url_for('auth.reset_password', token=token) }}" method="post">
        <div class="form-group">
            <label for="password">Nova Senha</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirmar Nova Senha</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
        </div>

        <button type="submit" class="btn-login">Redefinir Senha</button>
    </form>
</div>
{% endblock %}
