{% extends "base.html" %}

{% block title %}Análise Financeira{% endblock %}

{% block content %}
<div class="main-content">
    <h1>Análise Financeira</h1>
    <p>Veja a evolução do seu saldo ao longo do tempo.</p>

    <div class="chart-container" style="position: relative; height:40vh; width:80vw">
        <canvas id="balanceEvolutionChart"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/balance_evolution')
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('balanceEvolutionChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Evolução do Saldo',
                            data: data.data,
                            borderColor: 'rgba(75, 192, 192, 1)',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            tension: 0.1
                        }]
                    }
                });
            });
    });
</script>
{% endblock %}
