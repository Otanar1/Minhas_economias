[pytest]
# Define o diretório onde os testes estão localizados
testpaths = tests

# Adiciona o diretório raiz ao PYTHONPATH para permitir importações como "from src.main import app"
pythonpath = .

# Define variáveis de ambiente específicas para o ambiente de teste
env =
    # Define o ambiente do Flask como 'testing' para desativar o modo de depuração, etc.
    FLASK_ENV=testing
    # Usa um banco de dados SQLite em memória para garantir que os testes sejam rápidos e isolados
    DATABASE_URL=sqlite:///:memory:
    # Define uma chave secreta fixa para os testes
    SECRET_KEY=my-test-secret-key
    # Desativa a proteção CSRF em formulários, se aplicável (simplifica os testes)
    WTF_CSRF_ENABLED=false
